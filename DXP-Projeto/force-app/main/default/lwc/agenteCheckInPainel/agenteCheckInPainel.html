<template>
    <lightning-card title="Painel do Agente — Check-In" icon-name="standard:account">
        
        <template lwc:if={isLoading}>
            <div class= "slds-align_absolute-center slds-p-around_large">
                 <lightning-spinner alternative-text="Carregando..." size="medium"></lightning-spinner>
            </div>
        </template>

         <template lwc:if={hasError}>
            <div class="slds-p-around_medium">
                <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                <span class="slds-m-left_small">{errorMessage}</span>
            </div>
        </template>


         <template lwc:if={showContent}>
            <div class="slds-p-around_medium">

                
                <template lwc:if={conta.Necessita_Cuidados_Especiais__c}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                        <lightning-icon icon-name="utility:warning" variant="inverse" size="x-small"></lightning-icon>
                        <span class="slds-m-left_small">
                            <strong>Atenção:</strong> Cliente necessita de cuidados especiais.
                        </span>
                    </div>
                </template>

                
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="6" padding="around-small">
                        <div class="slds-box slds-text-align_center">
                            <p class="slds-text-color_weak slds-text-body_small">Check-Ins no Ano</p>
                            <p class="slds-text-heading_large">{conta.Numero_de_Check_Ins_no_Ano__c}</p>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" padding="around-small">
                        <div class="slds-box slds-text-align_center">
                            <p class="slds-text-color_weak slds-text-body_small">Check-Ins Totais</p>
                            <p class="slds-text-heading_large">{conta.Numero_de_Check_Ins_Totais__c}</p>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>

                
                <template lwc:if={proximoVoo}>
                    <div class="slds-m-top_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Próximo Voo</h3>
                        <div class="slds-box slds-theme_shade">
                            <lightning-layout vertical-align="center">
                                <lightning-layout-item flexibility="auto">
                                    <p class="slds-text-heading_small">{proximoVoo.Codigo_do_Voo__c}</p>
                                    <p class="slds-text-body_small">
                                        {proximoVoo.Aeroporto_de_Check_In__c} → {proximoVoo.Aeroporto_de_Destino__c}
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        {proximoVoo.Horario_do_Voo__c}
                                    </p>
                                    <p class="slds-text-body_small">
                                        Assento: <strong>{proximoVoo.Numero_do_Assento__c}</strong>
                                    </p>
                                </lightning-layout-item>
                                <lightning-layout-item>
                                    <lightning-badge label={proximoVoo.Status__c}></lightning-badge>
                                </lightning-layout-item>
                            </lightning-layout>
                        </div>
                    </div>
                </template>

                <!-- Demais check-ins abertos -->
                <template lwc:if={outrosCheckIns}>
                    <div class="slds-m-top_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Outros Check-Ins em Aberto</h3>
                        <template for:each={outrosCheckIns} for:item="ci">
                            <div key={ci.Id} class="slds-box slds-box_x-small slds-m-bottom_x-small">
                                <lightning-layout vertical-align="center">
                                    <lightning-layout-item flexibility="auto">
                                        <p class="slds-text-body_small slds-text-color_weak">{ci.Name}</p>
                                        <p class="slds-text-body_small">
                                            {ci.Aeroporto_de_Check_In__c} → {ci.Aeroporto_de_Destino__c}
                                        </p>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            {ci.Horario_do_Voo__c}
                                        </p>
                                    </lightning-layout-item>
                                    <lightning-layout-item>
                                        <lightning-badge label={ci.Status__c}></lightning-badge>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        </template>
                    </div>
                </template>

                
                <template lwc:if={semCheckIns}>
                    <div class="slds-m-top_medium slds-align_absolute-center">
                        <lightning-icon icon-name="utility:check" variant="success" size="small"></lightning-icon>
                        <span class="slds-m-left_small slds-text-color_success">
                            Nenhum check-in em aberto
                        </span>
                    </div>
                </template>

                
                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Novo Check-In"
                        variant="brand"
                        icon-name="utility:add"
                        onclick={handleNovoCheckIn}>
                    </lightning-button>
                </div>

            </div>
        </template>


    </lightning-card>
</template>
